# Cloud Run service spec for elderguard-api. Apply with:
#   gcloud run services replace infra/cloudrun.yaml --region=REGION --project=PROJECT
# deploy.yml substitutes REGION, PROJECT, and TAG before applying. No secret values live here;
# every secret is mounted from Secret Manager by name.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: elderguard-api
  labels:
    app: elderguard
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
    # Lets the deploy smoke test call the tagged canary URL with an ID token minted for this
    # audience (a revision tag URL is not the service URL, so the default audience would not match).
    run.googleapis.com/custom-audiences: '["elderguard-api"]'
spec:
  template:
    metadata:
      labels:
        app: elderguard
      annotations:
        # Request-based billing: CPU is only allocated while a request (or WebSocket) is open.
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
        # Twilio's webhook timeout is 15 s, so a cold start must stay well under it (startup-latency
        # alert at 8 s). The every-minute /internal/sweep keeps this instance warm, and with
        # request-based billing an idle warm instance costs nothing. Set 1 when the first real
        # senior depends on the line: that bills idle time but survives platform restarts.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        # Live calls hold state in the process. Affinity keeps a reconnect on the same instance.
        run.googleapis.com/sessionAffinity: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      # Cloud Run's ceiling. Sessions are capped at max_session_minutes (45) below this.
      timeoutSeconds: 3600
      serviceAccountName: elderguard-api@PROJECT.iam.gserviceaccount.com
      containers:
        - name: api
          image: REGION-docker.pkg.dev/PROJECT/elderguard/api:TAG
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi  # measured p99 ~100 MB at launch; recheck memory/utilizations before raising
          env:
            - name: ENV
              value: prod
            - name: LOG_LEVEL
              value: INFO
            - name: PUBLIC_BASE_URL
              value: https://api.getelderguard.org
            - name: CORS_ORIGINS
              value: ""
            - name: GCP_PROJECT
              value: PROJECT
            - name: STORE
              value: firestore
            - name: AUTH_MODE
              value: firebase
            - name: NOTIFY
              value: fcm
            - name: SCHEDULER_SERVICE_ACCOUNT
              value: elderguard-scheduler@PROJECT.iam.gserviceaccount.com
            - name: CONFIG_CACHE_SECONDS
              value: "30"
            - name: TWILIO_ACCOUNT_SID
              value: REPLACE_WITH_TWILIO_ACCOUNT_SID
            - name: TWILIO_GUARDIAN_NUMBER
              value: "+10000000000"
            - name: FAKE_PROVIDERS
              value: ""
            - name: DEV_ALLOWED_PHONES
              value: ""
            # Invite list for senior enrolment. deploy.yml fills it from the ENROLL_ALLOWED_PHONES
            # repository variable; unset means enrolment is closed.
            - name: ENROLL_ALLOWED_PHONES
              value: "REPLACE_WITH_ENROLL_ALLOWED_PHONES"
            - name: SCORING_SPEED_FACTOR
              value: "1.0"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ANTHROPIC_API_KEY
                  key: latest
            - name: STT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: STT_API_KEY
                  key: latest
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: TWILIO_AUTH_TOKEN
                  key: latest
            - name: PHONE_HASH_PEPPER
              valueFrom:
                secretKeyRef:
                  name: PHONE_HASH_PEPPER
                  key: latest
            - name: STREAM_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: STREAM_TOKEN_SECRET
                  key: latest
            # Sentry is optional. Cloud Run refuses to start a revision that mounts a secret with
            # no version, so uncomment this only after `SENTRY_DSN` has one (infra/README.md).
            # - name: SENTRY_DSN
            #   valueFrom:
            #     secretKeyRef:
            #       name: SENTRY_DSN
            #       key: latest
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            # Poll every second: Cloud Run holds requests until this passes, so a 2 s grid added up
            # to 2 s to every cold start. Uvicorn binds only after lifespan startup, so the first
            # 200 means ready. Timeout may not exceed the period; /health has no dependencies.
            initialDelaySeconds: 0
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true
