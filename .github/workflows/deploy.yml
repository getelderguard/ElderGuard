name: deploy

# Deploys elderguard-api to Cloud Run. Auth is Workload Identity Federation: no JSON keys.
# Repository variables (set once from the bootstrap.sh output):
#   GCP_PROJECT, GCP_REGION, WIF_PROVIDER, DEPLOY_SA
#   TWILIO_ACCOUNT_SID, TWILIO_GUARDIAN_NUMBER (not secrets, but kept out of the public spec;
#   GitHub push protection rejects a committed account SID)
# Trigger: push a tag like v0.3.0, or run manually with an optional ref.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      canary_percent:
        description: "Traffic to send to the new revision before the smoke test promotes it to 100"
        default: "10"
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  SERVICE: elderguard-api
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/elderguard/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Require the Twilio repository variables
        env:
          TWILIO_ACCOUNT_SID: ${{ vars.TWILIO_ACCOUNT_SID }}
          TWILIO_GUARDIAN_NUMBER: ${{ vars.TWILIO_GUARDIAN_NUMBER }}
        run: |
          [[ "$TWILIO_ACCOUNT_SID" =~ ^AC[0-9a-f]{32}$ ]] || { echo "set the TWILIO_ACCOUNT_SID repository variable" >&2; exit 1; }
          [[ "$TWILIO_GUARDIAN_NUMBER" =~ ^\+1[0-9]{10}$ ]] || { echo "set TWILIO_GUARDIAN_NUMBER in E.164, e.g. +15551234567" >&2; exit 1; }

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker auth to Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        id: build
        run: |
          TAG="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" backend
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Render service spec (pin traffic to the current revision)
        run: |
          CURRENT_REV="$(gcloud run services describe "$SERVICE" --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT }}" --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)"
          echo "CURRENT_REV=${CURRENT_REV}" >> "$GITHUB_ENV"
          sed -e "s#REGION-docker.pkg.dev/PROJECT/elderguard/api:TAG#${IMAGE}:${{ steps.build.outputs.tag }}#g" \
              -e "s#\bPROJECT\b#${{ vars.GCP_PROJECT }}#g" \
              -e "s#REPLACE_WITH_TWILIO_ACCOUNT_SID#${{ vars.TWILIO_ACCOUNT_SID }}#g" \
              -e "s#\"+10000000000\"#\"${{ vars.TWILIO_GUARDIAN_NUMBER }}\"#g" \
              infra/cloudrun.yaml > /tmp/service.yaml
          python3 - "$CURRENT_REV" <<'PY'
          import re, sys
          current = sys.argv[1]
          p = "/tmp/service.yaml"
          s = open(p).read()
          # First deploy: let the new revision take traffic. Later deploys: keep serving the
          # current revision until the smoke test below promotes the new one.
          if current:
              block = f"  traffic:\n    - percent: 100\n      revisionName: {current}\n"
              s = re.sub(r"  traffic:\n(?:    .*\n?)+", block, s)
          open(p, "w").write(s)
          PY
          grep -n "image:\|revisionName\|latestRevision" /tmp/service.yaml

      - name: Apply spec, then send the canary share to the new revision
        run: |
          gcloud run services replace /tmp/service.yaml \
            --region="${{ vars.GCP_REGION }}" --project="${{ vars.GCP_PROJECT }}" --quiet
          NEW_REV="$(gcloud run services describe "$SERVICE" --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT }}" --format='value(status.latestCreatedRevisionName)')"
          echo "NEW_REV=${NEW_REV}" >> "$GITHUB_ENV"
          if [[ -n "$CURRENT_REV" && "$CURRENT_REV" != "$NEW_REV" ]]; then
            gcloud run services update-traffic "$SERVICE" --region="${{ vars.GCP_REGION }}" \
              --project="${{ vars.GCP_PROJECT }}" \
              --to-revisions="${NEW_REV}=${{ github.event.inputs.canary_percent || '10' }},${CURRENT_REV}=$((100 - ${{ github.event.inputs.canary_percent || '10' }}))"
          fi

      - name: Smoke test the canary revision directly
        run: |
          URL="$(gcloud run revisions describe "$NEW_REV" --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT }}" --format='value(status.url)')"
          # Revision URLs need an identity token unless the service allows unauthenticated; use one.
          TOKEN="$(gcloud auth print-identity-token)"
          for i in 1 2 3 4 5 6; do
            if curl -fsS -H "Authorization: Bearer ${TOKEN}" "${URL}/ready" | tee /tmp/ready.json; then break; fi
            sleep 5
          done
          python3 - <<'PY'
          import json, sys
          r = json.load(open("/tmp/ready.json"))
          assert r.get("env") == "prod", r
          assert r.get("scorer_routes"), "no scorer routes configured"
          assert r.get("transcriber_routes"), "no transcriber routes configured"
          print("ready:", r)
          PY

      - name: Promote to 100%
        run: |
          gcloud run services update-traffic "$SERVICE" --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT }}" --to-latest
          echo "deployed ${NEW_REV} at 100%"

      - name: Roll back on failure
        if: failure() && env.NEW_REV != ''
        run: |
          echo "smoke failed; sending 0% to ${NEW_REV}"
          gcloud run services update-traffic "$SERVICE" --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT }}" --to-revisions="${NEW_REV}=0" || true
